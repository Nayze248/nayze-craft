<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConfigGamer | Les meilleurs prix</title>
    <!-- Utilisation de Tailwind CSS pour un design rapide et moderne -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- En-tête avec Panier -->
    <header class="bg-gray-900 text-white p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-blue-500">ConfigGamer</h1>
        <div class="relative">
            <button id="cartBtn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded">
                Panier (<span id="cartCount">0</span>)
            </button>
        </div>
    </header>

    <!-- Section des Meilleures Promos -->
    <main class="max-w-6xl mx-auto mt-8 p-4">
        <h2 class="text-3xl font-bold mb-6 text-gray-800">🔥 Meilleures Promos du Moment</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="productContainer">
            <!-- Produit 1 -->
            <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200">
                <img src="https://via.placeholder.com/200" alt="RTX 4070" class="w-full h-48 object-cover mb-4">
                <h3 class="text-xl font-bold">NVIDIA GeForce RTX 4070</h3>
                <p class="text-sm text-gray-500 mt-2">Comparé sur 4 sites</p>
                <div class="mt-4 flex justify-between items-center">
                    <div>
                        <p class="text-xs text-gray-400 line-through">659,99 €</p>
                        <p class="text-2xl font-bold text-green-600">599,90 €</p>
                    </div>
                    <button onclick="addToCart('RTX 4070', 599.90)" class="bg-gray-900 text-white px-3 py-2 rounded hover:bg-gray-700">
                        Ajouter
                    </button>
                </div>
                <div class="mt-3 text-sm text-blue-500 hover:underline cursor-pointer">
                    Voir les caractéristiques et les 4 offres >
                </div>
            </div>
            
            <!-- Ajouter d'autres produits de la même manière -->
        </div>
    </main>

    <script>
        // Logique très simple du panier
        let cart = [];

        function addToCart(productName, price) {
            cart.push({ name: productName, price: price });
            document.getElementById('cartCount').innerText = cart.length;
            alert(`${productName} ajouté au panier !`);
        }
    </script>

    <!-- Formulaire de demande de montage personnalisé -->
<section class="max-w-3xl mx-auto bg-white p-8 mt-12 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6">Demander un montage sur mesure</h2>
    
    <!-- Remplacez VOTRE_CODE_FORMSPREE par celui fourni par Formspree -->
    <form action="https://formspree.io/f/VOTRE_CODE_FORMSPREE" method="POST" class="space-y-4">
        
        <div>
            <label class="block text-gray-700 font-bold mb-2">Votre Email</label>
            <input type="email" name="email" required class="w-full border p-2 rounded">
        </div>

        <div>
            <label class="block text-gray-700 font-bold mb-2">Budget approximatif (€)</label>
            <input type="number" name="budget" required class="w-full border p-2 rounded">
        </div>

        <div>
            <label class="block text-gray-700 font-bold mb-2">Composants souhaités (Votre Panier actuel)</label>
            <!-- Ce champ textarea pourra être rempli automatiquement par le JavaScript du panier -->
            <textarea name="composants" id="composantsInput" rows="5" class="w-full border p-2 rounded" placeholder="Ex: RTX 4070, Ryzen 7 7800X3D..."></textarea>
        </div>
        
        <div>
            <label class="block text-gray-700 font-bold mb-2">Besoins spécifiques (Esthétique, silence, etc.)</label>
            <textarea name="message" rows="3" class="w-full border p-2 rounded"></textarea>
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-500">
            Envoyer ma demande de montage
        </button>
    </form>
</section>
</body>
</html>
