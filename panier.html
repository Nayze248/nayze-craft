<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier | ConfigGamer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex flex-col min-h-screen">

    <!-- Navbar -->
    <header class="bg-gray-900 text-white sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 gap-4">
                
                <div class="flex-shrink-0">
                    <a href="index.html" class="text-2xl font-black text-blue-500 tracking-wide flex items-center gap-2">
                        💻 ConfigGamer
                    </a>
                </div>

                <div class="hidden md:flex items-center space-x-6">
                    <a href="index.html" class="text-gray-300 hover:text-white font-medium text-sm transition">Accueil</a>
                    <a href="configurateur.html" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm px-4 py-2 rounded-lg transition">🔧 Configurateur Sur-Mesure</a>
                    <a href="panier.html" class="flex items-center gap-2 bg-gray-800 border border-blue-500 text-white px-3 py-2 rounded-lg font-semibold text-sm">
                        🛒 Panier
                        <span id="cartBadge" class="bg-blue-600 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                    </a>
                </div>

                <div class="flex items-center gap-2 md:hidden">
                    <button id="mobileMenuBtn" class="p-2 text-gray-400 hover:text-white">☰</button>
                </div>
            </div>

            <div id="mobileMenu" class="hidden md:hidden border-t border-gray-800 py-3 space-y-2">
                <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-gray-300">Accueil</a>
                <a href="configurateur.html" class="block px-3 py-2 rounded-md text-base font-medium bg-blue-600 text-white">🔧 Configurateur Sur-Mesure</a>
                <a href="panier.html" class="block px-3 py-2 rounded-md text-base font-medium text-white bg-gray-800">🛒 Mon Panier</a>
            </div>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-5xl mx-auto px-4 py-10 flex-grow w-full">
        <h2 class="text-3xl font-extrabold text-gray-800 mb-8 flex items-center gap-3">
            🛒 Votre Panier
        </h2>

        <!-- Zone d'affichage du panier (Remplie dynamiquement par script.js) -->
        <div id="cartPageContainer" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Injecté par JavaScript -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 text-center py-6 mt-auto">
        <p>&copy; 2026 ConfigGamer. Tous droits réservés.</p>
    </footer>

    <!-- Liaison JS -->
    <script src="script.js"></script>
</body>
</html>
